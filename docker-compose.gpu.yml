# GPU 覆盖文件：检测到 NVIDIA GPU + Docker GPU 直通成功时由启动脚本自动叠加
services:
  ollama:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
