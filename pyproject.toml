[project]
name = "edagent"
version = "0.1.0"
description = "EdAgent - localized AI agent (LangGraph + RAG, OpenAI-compatible LLM)"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # 配置 / 校验
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # LangChain / LangGraph（业务代码只用 OpenAI 兼容协议）
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.1.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    # 存储 / 缓存
    "psycopg[binary,pool]>=3.2",
    "redis>=5.1",
    "chromadb>=0.5",
    # Web UI 登录会话签名 Cookie
    "itsdangerous>=2.2",
    # 文档解析（PDF / HTML / Markdown / TXT）
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    # 可观测性
    "prometheus-client>=0.21",
    "opentelemetry-distro>=0.47",
    "opentelemetry-instrumentation-fastapi>=0.47",
    "opentelemetry-instrumentation-httpx>=0.47",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[tool.uv]
package = false

[tool.uv.sources]
# 全部走 PyPI，保证容器内可重复解析
